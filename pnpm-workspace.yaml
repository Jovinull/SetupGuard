packages:
  - 'packages/*'

# Postinstall scripts, decided explicitly. pnpm blocks every command until each
# one is either allowed or refused, so a clone that does not set these cannot
# run `pnpm check`.
#
# The key is `allowBuilds` because this repository is pinned to pnpm 11;
# pnpm 10 spells the same setting `onlyBuiltDependencies`.
allowBuilds:
  # esbuild (Vitest, and the extension bundler) fetches its native binary.
  esbuild: true
  # @vscode/vsce ships a signing helper. Signing only happens when publishing to
  # the Marketplace, which this repository does not do, so the script is refused
  # rather than trusted.
  '@vscode/vsce-sign': false

# pnpm holds back packages published very recently. @vscode/vsce 4.0.0 is
# pinned exactly and is a development-only tool: it produces a local .vsix and
# never runs in CI or at run time. 4.x is also the first line that dropped the
# deprecated native `keytar` dependency, which is why an older release is not
# used instead.
minimumReleaseAgeExclude:
  - '@vscode/vsce@4.0.0'

# Advisories `pnpm audit` skips. Each one is a risk that was assessed and
# accepted, NOT a fix: the vulnerable package is still installed. Every entry
# must also be in scripts/check-audit-exceptions.mjs with a review date; CI
# fails once that date passes, so no exception can stay here unnoticed.
audit:
  ignore:
    # minimatch: DoS through globparts amplification, fixed only in 11.0.1.
    # Development tooling only (ESLint, typescript-eslint, @vscode/vsce); not in
    # the action bundle or the VSIX. The vulnerable code runs only with
    # `optimizationLevel >= 2`, which no installed consumer sets. Full analysis:
    # Notes/17-github-action-implementada.md. Review by 2026-11-30.
    - GHSA-g3hv-75wg-m249
