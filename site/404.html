  <style>
    :root { color-scheme: dark light; --bg: #0b0d10; --text: #e7eaee; --muted: #a3acb7; --accent: #5ee3a1; --line: #262c35; }
    @media (prefers-color-scheme: light) { :root { --bg: #f7f8fa; --text: #12161c; --muted: #46505d; --accent: #0a7a4d; --line: #dde2e8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.6; padding: 24px; }
    main { max-width: 560px; }
    p.code { font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; color: var(--accent); margin: 0 0 12px; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -0.03em; line-height: 1.15; margin: 0 0 14px; }
    p { color: var(--muted); margin: 0 0 22px; }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 10px 22px; border-top: 1px solid var(--line); padding-top: 18px; }
  </style>
</head>

    </ul>
  </main>
</body>
</html>
