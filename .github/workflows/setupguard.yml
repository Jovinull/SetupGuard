name: SetupGuard

# SetupGuard checking its own pull requests: the first consumer of the action.
#
# `pull_request`, never `pull_request_target`: on a fork the token is
# read-only and no secret is exposed, and SetupGuard only reads files — it
# never runs anything from the pull request. The action refuses
# pull_request_target outright.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  readiness:
    name: repository readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default ref matters: on pull_request it is the merge commit, which
      # the action compares with its first parent. Do not override `ref`.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # `./` runs the action from this checkout, so a pull request that changes
      # the action is checked by its own version. Other repositories reference
      # Jovinull/SetupGuard pinned to a commit SHA instead.
      - uses: ./
