name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action below is pinned to a commit SHA rather than a tag: a tag can be
# moved to point at different code, and these actions run with access to the
# checkout. The trailing comment records which release the SHA came from.

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # SetupGuard reads paths, symlinks and PATH, all of which differ by
        # platform. Linux-only CI would not prove the tool works where its
        # users are.
        #
        # Caveat: the symlink-confinement tests skip themselves on Windows,
        # where creating a link needs elevation. A green matrix does not prove
        # that boundary holds there.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The lowest version package.json#engines allows, and the current LTS.
        node: ['22.13.0', '24']

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile is what proves a fresh clone can install: it fails if
      # the lockfile and the manifests have drifted apart.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test

      # Dogfooding: the tool must report READY on its own repository.
      # 0 = READY, 1 = findings, 3 = it could not finish checking.
      #
      # Only on the runtime this repository recommends. `.nvmrc` pins Node 24
      # while `engines.node` accepts >=22.13, so on the 22.13 leg SetupGuard
      # correctly reports that the runner is not on the recommended version —
      # a true finding about a real runner, not a defect in the repository.
      # Deleting `.nvmrc` would make every leg green by removing a declaration
      # that contributors actually use, which is precisely the drift this tool
      # exists to catch. So the assertion is scoped instead.
      - if: matrix.node == '24'
        run: node packages/cli/dist/bin.js .

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
