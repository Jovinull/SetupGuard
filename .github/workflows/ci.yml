name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action below is pinned to a commit SHA rather than a tag: a tag can be
# moved to point at different code, and these actions run with access to the
# checkout. The trailing comment records which release the SHA came from.

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # SetupGuard reads paths, symlinks and PATH, all of which differ by
        # platform. Linux-only CI would not prove the tool works where its
        # users are.
        #
        # Caveat: the symlink-confinement tests skip themselves on Windows,
        # where creating a link needs elevation. A green matrix does not prove
        # that boundary holds there.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The lowest version package.json#engines allows, and the current LTS.
        node: ['22.13.0', '24']

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile is what proves a fresh clone can install: it fails if
      # the lockfile and the manifests have drifted apart.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test

      # Every supported runtime must prove that the built CLI starts and can
      # diagnose the repository. Static checks are independent of the runner's
      # own Node version, so this assertion belongs on every matrix leg.
      - run: node packages/cli/dist/bin.js . --level static

      # The full diagnosis also checks the local environment. `.nvmrc` pins
      # Node 24 while `engines.node` accepts >=22.13, so a Node 22.13 runner is
      # correctly BLOCKED by the runtime check. Run this assertion only where
      # the runner matches the repository's recommended development runtime.
      - if: matrix.node == '24'
        run: node packages/cli/dist/bin.js .

  extension:
    name: vsix package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # A VSIX that stops building is a release that cannot happen, and the
      # failure would otherwise only show up by hand.
      - run: pnpm --filter setupguard run package

      # These tests load `out/extension.cjs` and activate it, so they only run
      # where a bundle exists. They skip themselves in the matrix jobs.
      - run: pnpm exec vitest run packages/vscode/test/bundle.test.ts

      # The VSIX is what a user installs, so its contents are part of the
      # contract. Sources, tests, fixtures and Notes must never be in it, and an
      # exact list is the only check that catches a file nobody thought about.
      #
      # LC_ALL=C because the order has to be the same everywhere: a locale-aware
      # sort puts `extension.vsixmanifest` and `extension/LICENSE.txt` in a
      # different order than the byte order does, and the list would then pass
      # or fail depending on the machine.
      - name: verify the vsix contents
        env:
          LC_ALL: C
        run: |
          cd packages/vscode
          unzip -Z1 setupguard-0.1.0.vsix | sort > actual.txt
          cat actual.txt
          cat > expected.txt <<'EOF'
          [Content_Types].xml
          extension.vsixmanifest
          extension/LICENSE.txt
          extension/changelog.md
          extension/out/extension.cjs
          extension/package.json
          extension/readme.md
          EOF
          diff -u expected.txt actual.txt

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
